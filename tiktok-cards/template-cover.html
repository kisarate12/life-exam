<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Inter:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Noto Sans JP', 'Inter', sans-serif;
    background: var(--bg-base, #1a1a2e);
    color: #fff;
    position: relative;
  }

  .bg-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 50% at 50% 40%, var(--bg-glow1, rgba(255, 184, 78, 0.18)) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 70% 60%, var(--bg-glow2, rgba(245, 117, 80, 0.12)) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-base, #1a1a2e) 0%, var(--bg-mid, #16213e) 50%, var(--bg-base, #1a1a2e) 100%);
  }

  /* セーフゾーン: top 200px / bottom 400px */
  .content {
    position: absolute;
    top: 200px;
    left: 0;
    right: 0;
    height: 1320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 40px;
  }

  /* --- カテゴリタグ --- */
  .category-tag {
    margin-top: 10px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--tag-bg, rgba(245, 117, 80, 0.15));
    border: 1.5px solid var(--tag-border, rgba(245, 117, 80, 0.4));
    border-radius: 40px;
    padding: 12px 36px;
    font-size: 28px;
    font-weight: 700;
    color: var(--tag-color, #FF9A76);
    letter-spacing: 0.06em;
  }

  /* --- メイン見出し --- */
  .headline {
    margin-top: 30px;
    text-align: center;
    line-height: 1.3;
    width: 100%;
  }
  .headline .top-line {
    font-size: 88px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 4px 24px rgba(0,0,0,0.6);
    letter-spacing: 0.04em;
  }
  .headline .main-line {
    margin-top: 8px;
    font-size: 180px;
    font-weight: 900;
    background: var(--accent-gradient, linear-gradient(135deg, #FFB84E 0%, #F57550 50%, #FFB84E 100%));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 6px 32px var(--accent-shadow, rgba(245, 117, 80, 0.6)));
    letter-spacing: 0.05em;
    line-height: 1.1;
  }
  .headline .num {
    font-family: 'Inter', sans-serif;
    font-size: 220px;
    font-weight: 900;
    letter-spacing: 0;
  }

  /* --- キャラクター3体並び --- */
  .characters {
    margin-top: 40px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 20px;
    width: 100%;
  }
  .char-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .char-slot.center {
    transform: scale(1.12);
    transform-origin: bottom center;
  }
  .char-img-wrap {
    position: relative;
    width: 220px;
    height: 220px;
  }
  .char-slot.center .char-img-wrap {
    width: 240px;
    height: 240px;
  }
  .char-img-wrap::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      var(--ring-color1, rgba(255, 184, 78, 0.5)),
      var(--ring-color2, rgba(245, 117, 80, 0.3)),
      var(--ring-color1, rgba(255, 184, 78, 0.5))
    );
    filter: blur(2px);
  }
  .char-img {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: contain;
    background: rgba(255,255,255, 0.07);
    border: 3px solid rgba(255,255,255, 0.12);
    padding: 12px;
  }
  .char-code {
    font-family: 'Inter', monospace;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 0.12em;
    color: var(--accent-text, rgba(255, 184, 78, 0.8));
  }
  .char-name {
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }

  /* --- 区切り線 --- */
  .divider {
    margin-top: 40px;
    width: 120px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent-text, rgba(255, 184, 78, 0.6)), transparent);
    border-radius: 2px;
  }

  /* --- サブテキスト --- */
  .sub-text {
    margin-top: 28px;
    text-align: center;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.8;
    color: rgba(255,255,255, 0.7);
  }
  .sub-text .hl {
    color: var(--accent-text, #FFB84E);
  }

  .bottom-accent {
    position: absolute;
    bottom: 380px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    color: rgba(255,255,255, 0.35);
    letter-spacing: 0.3em;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="content">
    <div class="category-tag">人生診断 16タイプ</div>

    <div class="headline">
      <div class="top-line" id="topLine">勝ち組人生タイプ</div>
      <div class="main-line"><span class="num" id="mainNum">3</span><span id="mainSuffix">選</span></div>
    </div>

    <div class="characters">
      <div class="char-slot">
        <div class="char-img-wrap">
          <img class="char-img" id="charImg1" src="" alt="">
        </div>
        <div class="char-code" id="charCode1"></div>
        <div class="char-name" id="charName1"></div>
      </div>
      <div class="char-slot center">
        <div class="char-img-wrap">
          <img class="char-img" id="charImg2" src="" alt="">
        </div>
        <div class="char-code" id="charCode2"></div>
        <div class="char-name" id="charName2"></div>
      </div>
      <div class="char-slot">
        <div class="char-img-wrap">
          <img class="char-img" id="charImg3" src="" alt="">
        </div>
        <div class="char-code" id="charCode3"></div>
        <div class="char-name" id="charName3"></div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="sub-text" id="subText">
      あなたは<span class="hl">どのタイプ</span>？<br>
      スワイプでチェック →
    </div>
  </div>

  <div class="bottom-accent">LIFE DIAGNOSIS</div>
</body>
</html>
