<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Inter:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Noto Sans JP', 'Inter', sans-serif;
    background: var(--bg-base, #1a1a2e);
    color: #fff;
    position: relative;
  }

  .bg-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 40%, var(--bg-glow1, rgba(255, 184, 78, 0.22)) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 30% 60%, var(--bg-glow2, rgba(245, 117, 80, 0.15)) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-base, #1a1a2e) 0%, var(--bg-mid, #16213e) 50%, var(--bg-base, #1a1a2e) 100%);
  }

  .content {
    position: absolute;
    top: 200px;
    left: 0;
    right: 0;
    height: 1320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 60px;
  }

  .category-tag {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--tag-bg, rgba(245, 117, 80, 0.15));
    border: 1.5px solid var(--tag-border, rgba(245, 117, 80, 0.4));
    border-radius: 40px;
    padding: 12px 36px;
    font-size: 28px;
    font-weight: 700;
    color: var(--tag-color, #FF9A76);
    letter-spacing: 0.06em;
  }

  .hook-text {
    margin-top: 60px;
    text-align: center;
    font-size: 80px;
    font-weight: 900;
    line-height: 1.35;
    color: #fff;
    text-shadow: 0 6px 32px rgba(0,0,0,0.7);
  }
  .hook-text .hl {
    background: var(--accent-gradient, linear-gradient(135deg, #FFB84E 0%, #F57550 100%));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 20px var(--accent-shadow, rgba(245, 117, 80, 0.6)));
  }
  .hook-text .red {
    color: #FF4444;
    -webkit-text-fill-color: #FF4444;
    text-shadow: 0 0 40px rgba(255,68,68,0.5);
  }
  .hook-text .small {
    font-size: 56px;
    color: rgba(255,255,255, 0.7);
    -webkit-text-fill-color: rgba(255,255,255, 0.7);
  }

  .char-row {
    margin-top: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  .char-circle {
    position: relative;
    width: 160px;
    height: 160px;
  }
  .char-circle::before {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      var(--ring-color1, rgba(255, 184, 78, 0.5)),
      var(--ring-color2, rgba(245, 117, 80, 0.3)),
      var(--ring-color1, rgba(255, 184, 78, 0.5))
    );
    filter: blur(2px);
  }
  .char-circle img {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: contain;
    background: rgba(255,255,255, 0.07);
    border: 3px solid rgba(255,255,255, 0.12);
    padding: 10px;
  }
  .char-circle .q-mark {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: rgba(255,255,255, 0.05);
    border: 3px solid rgba(255,255,255, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    font-weight: 900;
    color: var(--accent-text, #FFB84E);
  }

  .sub-text {
    margin-top: 60px;
    text-align: center;
    font-size: 38px;
    font-weight: 700;
    line-height: 1.7;
    color: rgba(255,255,255, 0.6);
  }
  .sub-text .hl {
    color: var(--accent-text, #FFB84E);
  }

  .swipe-cta {
    margin-top: 40px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 36px;
    font-weight: 900;
    color: var(--accent-text, #FFB84E);
    letter-spacing: 0.08em;
  }
  .swipe-arrow {
    font-size: 48px;
    animation: bounce 1.5s ease infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(12px); }
  }

  .bottom-accent {
    position: absolute;
    bottom: 380px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    color: rgba(255,255,255, 0.35);
    letter-spacing: 0.3em;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="content">
    <div class="category-tag" id="categoryTag">人生診断 16タイプ</div>

    <div class="hook-text" id="hookText">
      これに<br>
      <span class="hl">当てはまったら</span><br>
      <span class="red">人生終了</span>
    </div>

    <div class="char-row" id="charRow">
      <!-- JS で動的生成 -->
    </div>

    <div class="sub-text" id="subText">
      あなたは<span class="hl">大丈夫</span>？
    </div>

    <div class="swipe-cta" id="swipeCta">
      スワイプでチェック <span class="swipe-arrow">→</span>
    </div>
  </div>

  <div class="bottom-accent">LIFE DIAGNOSIS</div>
</body>
</html>
